---
- name: Sudoers configuration drift check
  hosts: compliance
  become: no

  vars:
    dotfiles_repo: /home/ecloaiza/devops/github/linux_dotfiles
    sync_script: /home/ecloaiza/devops/github/linux_dotfiles/scripts/sync-sudoers-ci.sh

  tasks:
    - name: Pull latest dotfiles
      ansible.builtin.command:
        cmd: git pull
        chdir: "{{ dotfiles_repo }}"
      register: git_pull
      changed_when: "'Already up to date' not in git_pull.stdout"

    - name: Run sudoers sync script
      ansible.builtin.command:
        cmd: sudo {{ sync_script }}
      register: sync_result
      changed_when: "'Copying' in sync_result.stdout or 'changed' in sync_result.stdout"

    - name: Show sync output
      ansible.builtin.debug:
        msg: "{{ sync_result.stdout_lines }}"
