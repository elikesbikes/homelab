---
- name: Onboarding - Full System Setup
  hosts: all
  become: yes

  tasks:

    # ==========================================
    # PRE-SETUP
    # ==========================================
    - name: "[pre] Install EPEL (RedHat)"
      package:
        name: epel-release
        state: present
      when: ansible_os_family == 'RedHat'

    # ==========================================
    # CORE
    # ==========================================
    - name: "[core] Install OpenSSH client (Debian)"
      apt:
        name: openssh-client
        state: present
      when: ansible_os_family == 'Debian'

    - name: "[core] Install OpenSSH client (RedHat)"
      dnf:
        name: openssh-clients
        state: present
      when: ansible_os_family == 'RedHat'

    - name: "[core] Install Flatpak and GNOME plugin (Debian)"
      apt:
        name:
          - flatpak
          - gnome-software-plugin-flatpak
        state: present
      when: ansible_os_family == 'Debian'

    - name: "[core] Install Flatpak and GNOME plugin (RedHat)"
      dnf:
        name:
          - flatpak
          - gnome-software-plugin-flatpak
        state: present
      when: ansible_os_family == 'RedHat'

    - name: "[core] Add Flathub remote"
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        state: present

    # ==========================================
    # CLI TOOLS
    # ==========================================
    - name: "[cli] Install CLI tools (Debian)"
      apt:
        name:
          - git
          - curl
          - wget
          - direnv
          - figlet
          - stow
          - zoxide
          - neovim
          - fastfetch
        state: present
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: "[cli] Install CLI tools (RedHat)"
      dnf:
        name:
          - git
          - curl
          - wget
          - direnv
          - figlet
          - stow
          - zoxide
          - neovim
        state: present
      when: ansible_os_family == 'RedHat'

    # fastfetch not in standard RHEL repos — install binary from GitHub
    - name: "[cli] Install fastfetch binary (RedHat)"
      shell: |
        LATEST=$(curl -fsSL https://api.github.com/repos/fastfetch-cli/fastfetch/releases/latest \
          | grep tag_name | cut -d'"' -f4)
        curl -fsSL "https://github.com/fastfetch-cli/fastfetch/releases/download/${LATEST}/fastfetch-linux-amd64.tar.gz" \
          | tar -xz -C /usr/local/bin --strip-components=2 fastfetch-linux-amd64/usr/bin/fastfetch
      args:
        creates: /usr/local/bin/fastfetch
      when: ansible_os_family == 'RedHat'

    - name: "[cli] Install exa (Debian)"
      apt:
        name: exa
        state: present
      ignore_errors: yes
      register: exa_result
      when: ansible_os_family == 'Debian'

    - name: "[cli] Install eza fallback (Debian)"
      apt:
        name: eza
        state: present
      when: ansible_os_family == 'Debian' and exa_result is defined and exa_result is failed

    - name: "[cli] Install eza (RedHat)"
      dnf:
        name: eza
        state: present
      ignore_errors: yes
      when: ansible_os_family == 'RedHat'

    - name: "[cli] Remove tree-sitter-cli (Debian)"
      apt:
        name: tree-sitter-cli
        state: absent
        autoremove: yes
      ignore_errors: yes
      when: ansible_os_family == 'Debian'

    - name: "[cli] Remove tree-sitter-cli (RedHat)"
      dnf:
        name: tree-sitter-cli
        state: absent
      ignore_errors: yes
      when: ansible_os_family == 'RedHat'

    - name: "[cli] Install Starship prompt"
      shell: curl -fsSL https://starship.rs/install.sh | sh -s -- -y
      args:
        creates: /usr/local/bin/starship

    - name: "[cli] Install snapd (Debian)"
      apt:
        name: snapd
        state: present
      when: ansible_os_family == 'Debian'

    - name: "[cli] Install snapd (RedHat)"
      dnf:
        name: snapd
        state: present
      when: ansible_os_family == 'RedHat'

    - name: "[cli] Install yazi via snap"
      community.general.snap:
        name: yazi
        classic: yes
        state: present

    # ==========================================
    # DOTFILES
    # ==========================================
    - name: "[dotfiles] Remove existing repo"
      file:
        path: "{{ ansible_env.HOME }}/devops/github/linux_dotfiles"
        state: absent
      become: no

    - name: "[dotfiles] Clone linux_dotfiles"
      git:
        repo: https://github.com/elikesbikes/linux_dotfiles
        dest: "{{ ansible_env.HOME }}/devops/github/linux_dotfiles"
        force: yes
      become: no

    - name: "[dotfiles] Remove ~/.bashrc for stow"
      file:
        path: "{{ ansible_env.HOME }}/.bashrc"
        state: absent
      become: no

    - name: "[dotfiles] Remove Omakub bash defaults (stow conflict)"
      file:
        path: "{{ ansible_env.HOME }}/.local/share/omakub/defaults/bash"
        state: absent
      become: no

    - name: "[dotfiles] Stow dotfiles to ~"
      shell: stow . -t ~
      args:
        chdir: "{{ ansible_env.HOME }}/devops/github/linux_dotfiles"
      become: no

    # ==========================================
    # DESKTOP - Flatpak Apps (both distros)
    # ==========================================
    - name: "[desktop] Install Flatpak desktop apps"
      community.general.flatpak:
        name: "{{ item }}"
        remote: flathub
        state: present
      loop:
        - app.bluebubbles.BlueBubbles
        - com.github.zocker_160.SyncThingy
        - com.yubico.yubioath
        - de.leopoldluley.Clapgrep
        - io.github.flattool.Warehouse
        - io.github.sigmasd.stimulator
        - net.nokyan.Resources
        - org.cryptomator.Cryptomator

    # ==========================================
    # DESKTOP - Native Apps
    # ==========================================
    - name: "[desktop] Install native packages (Debian)"
      apt:
        name:
          - timeshift
          - kitty
        state: present
      when: ansible_os_family == 'Debian'

    - name: "[desktop] Install native packages (RedHat)"
      dnf:
        name:
          - kitty        # timeshift not available on RHEL — skipped
        state: present
      when: ansible_os_family == 'RedHat'

    # Spotify via APT (Debian)
    - name: "[desktop] Create apt keyrings dir (Debian)"
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == 'Debian'

    - name: "[desktop] Add Spotify GPG key (Debian)"
      shell: |
        curl -fsSL https://download.spotify.com/debian/pubkey_C85668DF69375001.gpg \
          | gpg --dearmor -o /etc/apt/keyrings/spotify.gpg
        chmod 0644 /etc/apt/keyrings/spotify.gpg
      args:
        creates: /etc/apt/keyrings/spotify.gpg
      when: ansible_os_family == 'Debian'

    - name: "[desktop] Add Spotify APT repo (Debian)"
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/spotify.gpg] http://repository.spotify.com stable non-free"
        filename: spotify
        state: present
      when: ansible_os_family == 'Debian'

    - name: "[desktop] Install Spotify (Debian)"
      apt:
        name: spotify-client
        state: present
        update_cache: yes
      when: ansible_os_family == 'Debian'

    # Spotify via Flatpak (RedHat — no official RPM repo)
    - name: "[desktop] Install Spotify via Flatpak (RedHat)"
      community.general.flatpak:
        name: com.spotify.Client
        remote: flathub
        state: present
      when: ansible_os_family == 'RedHat'

    # RustDesk
    - name: "[desktop] Download RustDesk deb (Debian)"
      get_url:
        url: https://github.com/rustdesk/rustdesk/releases/download/1.4.4/rustdesk-1.4.4-x86_64.deb
        dest: /tmp/rustdesk.deb
      when: ansible_os_family == 'Debian'

    - name: "[desktop] Install RustDesk (Debian)"
      apt:
        deb: /tmp/rustdesk.deb
        state: present
      when: ansible_os_family == 'Debian'

    - name: "[desktop] Download RustDesk rpm (RedHat)"
      get_url:
        url: https://github.com/rustdesk/rustdesk/releases/download/1.4.4/rustdesk-1.4.4-0.x86_64.rpm
        dest: /tmp/rustdesk.rpm
      when: ansible_os_family == 'RedHat'

    - name: "[desktop] Install RustDesk (RedHat)"
      dnf:
        name: /tmp/rustdesk.rpm
        state: present
        disable_gpg_check: yes
      when: ansible_os_family == 'RedHat'

    - name: "[desktop] Install Todoist via snap"
      community.general.snap:
        name: todoist
        state: present

    # ==========================================
    # SECURITY - Proton Suite
    # ==========================================
    - name: "[security] Install dependencies (Debian)"
      apt:
        name:
          - wget
          - curl
          - ca-certificates
          - gnupg
        state: present
      when: ansible_os_family == 'Debian'

    - name: "[security] Install dependencies (RedHat)"
      dnf:
        name:
          - wget
          - curl
          - ca-certificates
          - gnupg2
        state: present
      when: ansible_os_family == 'RedHat'

    # --- Proton VPN ---
    - name: "[security] Download Proton VPN repo deb (Debian)"
      get_url:
        url: https://repo.protonvpn.com/debian/dists/stable/main/binary-all/protonvpn-stable-release_1.0.8_all.deb
        dest: /tmp/protonvpn-stable-release.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Install Proton VPN repo (Debian)"
      apt:
        deb: /tmp/protonvpn-stable-release.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Install Proton VPN GNOME desktop (Debian)"
      apt:
        name: proton-vpn-gnome-desktop
        state: present
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: "[security] Install Proton VPN repo rpm (RedHat)"
      dnf:
        name: "https://repo.protonvpn.com/fedora-{{ ansible_distribution_major_version }}-stable/public_component_repo/protonvpn-stable-release-1.0.4-1.noarch.rpm"
        state: present
        disable_gpg_check: yes
      when: ansible_os_family == 'RedHat'

    - name: "[security] Install Proton VPN GNOME desktop (RedHat)"
      dnf:
        name: proton-vpn-gnome-desktop
        state: present
      when: ansible_os_family == 'RedHat'

    # --- Proton Mail Desktop ---
    - name: "[security] Download Proton Mail Desktop deb (Debian)"
      get_url:
        url: https://proton.me/download/mail/linux/ProtonMail-desktop-beta.deb
        dest: /tmp/protonmail-desktop.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Install Proton Mail Desktop (Debian)"
      apt:
        deb: /tmp/protonmail-desktop.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Download Proton Mail Desktop rpm (RedHat)"
      get_url:
        url: https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
        dest: /tmp/protonmail-desktop.rpm
      when: ansible_os_family == 'RedHat'

    - name: "[security] Install Proton Mail Desktop (RedHat)"
      dnf:
        name: /tmp/protonmail-desktop.rpm
        state: present
        disable_gpg_check: yes
      when: ansible_os_family == 'RedHat'

    # --- Proton Mail Bridge ---
    - name: "[security] Download Proton Mail Bridge deb (Debian)"
      get_url:
        url: https://proton.me/download/bridge/protonmail-bridge_3.21.2-1_amd64.deb
        dest: /tmp/protonmail-bridge.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Install Proton Mail Bridge (Debian)"
      apt:
        deb: /tmp/protonmail-bridge.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Download Proton Mail Bridge rpm (RedHat)"
      get_url:
        url: https://proton.me/download/bridge/protonmail-bridge_3.21.2-1_amd64.rpm
        dest: /tmp/protonmail-bridge.rpm
      when: ansible_os_family == 'RedHat'

    - name: "[security] Install Proton Mail Bridge (RedHat)"
      dnf:
        name: /tmp/protonmail-bridge.rpm
        state: present
        disable_gpg_check: yes
      when: ansible_os_family == 'RedHat'

    # --- Proton Pass ---
    - name: "[security] Download Proton Pass deb (Debian)"
      get_url:
        url: https://proton.me/download/pass/linux/ProtonPass.deb
        dest: /tmp/protonpass.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Install Proton Pass (Debian)"
      apt:
        deb: /tmp/protonpass.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Download Proton Pass rpm (RedHat)"
      get_url:
        url: https://proton.me/download/pass/linux/ProtonPass.rpm
        dest: /tmp/protonpass.rpm
      when: ansible_os_family == 'RedHat'

    - name: "[security] Install Proton Pass (RedHat)"
      dnf:
        name: /tmp/protonpass.rpm
        state: present
        disable_gpg_check: yes
      when: ansible_os_family == 'RedHat'

    # --- Proton Authenticator ---
    - name: "[security] Download Proton Authenticator deb (Debian)"
      get_url:
        url: https://proton.me/download/authenticator/linux/ProtonAuthenticator.deb
        dest: /tmp/proton-authenticator.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Install Proton Authenticator (Debian)"
      apt:
        deb: /tmp/proton-authenticator.deb
      when: ansible_os_family == 'Debian'

    - name: "[security] Download Proton Authenticator rpm (RedHat)"
      get_url:
        url: https://proton.me/download/authenticator/linux/ProtonAuthenticator.rpm
        dest: /tmp/proton-authenticator.rpm
      when: ansible_os_family == 'RedHat'

    - name: "[security] Install Proton Authenticator (RedHat)"
      dnf:
        name: /tmp/proton-authenticator.rpm
        state: present
        disable_gpg_check: yes
      when: ansible_os_family == 'RedHat'
